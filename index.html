<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CK TRIPLE NINE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0a0a;color:white}
header{background:linear-gradient(90deg,#ff0000,#8b0000);padding:15px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #ff0000}
header h1{font-size:22px;letter-spacing:2px;color:#ffd700;text-shadow:0 0 10px #ff0000}
header p{font-size:12px;color:#ccc}
.balance{background:#1a1a1a;padding:12px;margin:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #333}
.btn-deposit{background:linear-gradient(90deg,#25D366,#0d6efd);padding:8px 15px;border-radius:5px;text-decoration:none;color:white;font-weight:bold;font-size:13px}
.container{padding:15px;max-width:1200px;margin:auto}
.section-title{font-size:16px;margin:15px 0 10px;color:#ffd700;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#1a1a1a;border-radius:10px;padding:12px;text-align:center;border:1px solid #333;transition:0.3s}
.card:hover{transform:scale(1.05);border-color:#ff0000;box-shadow:0 0 15px rgba(255,0,0,0.5)}
.card-img{width:100%;height:80px;background:linear-gradient(135deg,#0d6efd,#6610f2);border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:30px}
.card h3{font-size:13px;margin-bottom:5px;color:#fff}
.price{font-size:11px;color:#25D366;font-weight:bold;margin:5px 0}
.btn{display:block;padding:6px;background:linear-gradient(90deg,#ff0000,#8b0000);color:white;text-decoration:none;border-radius:5px;font-size:11px;font-weight:bold}
.payment-box{background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:15px;border:1px solid #ff0000}
.payment-box h4{color:#ffd700;margin-bottom:10px;font-size:15px}
.payment-number{background:#222;padding:10px;border-radius:5px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.copy-btn{background:#ff0000;color:white;border:none;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer}
footer{background:#111;text-align:center;padding:15px;margin-top:20px;font-size:12px;color:#666;border-top:2px solid #ff0000}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.card-img{height:60px;font-size:24px}}
</style>
</head>
<body>

<header>
  <h1>CK TRIPLE NINE</h1>
